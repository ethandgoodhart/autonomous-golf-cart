<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#minor)"/>
      <path d="M120 0H0V120" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cfe3ff"/>
    </marker>
  </defs>

  <!-- sheet -->
  <rect width="1440" height="720" fill="#12427a"/>
  <rect width="1440" height="720" fill="url(#major)"/>
  <rect x="24" y="24" width="1392" height="672" fill="none" stroke="#cfe3ff" stroke-width="3"/>
  <rect x="34" y="34" width="1372" height="652" fill="none" stroke="#cfe3ff" stroke-opacity="0.5" stroke-width="1"/>

  <g fill="none" stroke="#cfe3ff" stroke-width="2" stroke-dasharray="10 8">
    <rect x="72" y="72" width="400" height="300"/>
    <rect x="520" y="72" width="400" height="300"/>
    <rect x="968" y="72" width="400" height="300"/>
  </g>

  <!-- centre marks in each frame -->
  <g stroke="#cfe3ff" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M272 192V252M242 222H302"/>
    <circle cx="272" cy="222" r="46" fill="none" stroke-dasharray="4 6"/>
    <path d="M720 192V252M690 222H750"/>
    <circle cx="720" cy="222" r="46" fill="none" stroke-dasharray="4 6"/>
    <path d="M1168 192V252M1138 222H1198"/>
    <circle cx="1168" cy="222" r="46" fill="none" stroke-dasharray="4 6"/>
  </g>

  <g fill="#e6f0ff" font-size="20" letter-spacing="2" text-anchor="middle">
    <text x="272" y="340">STEERING MOTOR MOUNT</text>
    <text x="720" y="340">PEDAL ACTUATOR BRACKETS</text>
    <text x="1168" y="340">CAMERA + GPS MOUNTS</text>
  </g>
  <g fill="#cfe3ff" fill-opacity="0.6" font-size="13" letter-spacing="0.5" text-anchor="middle">
    <text x="272" y="104">DWG 01 · ODrive S1 + M8325s · 3:1 belt</text>
    <text x="720" y="104">DWG 02 · gas + brake linear actuators</text>
    <text x="1168" y="104">DWG 03 · 4× cameras · RTK antenna</text>
  </g>

  <!-- dimension line -->
  <g stroke="#cfe3ff" stroke-width="1.5">
    <path d="M72 404V428M1368 404V428"/>
    <path d="M78 416H1362" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <rect x="610" y="404" width="220" height="24" fill="#12427a"/>
  <text x="720" y="422" fill="#cfe3ff" font-size="16" letter-spacing="2" text-anchor="middle">RENDERS PENDING</text>

  <!-- headline -->
  <text x="72" y="530" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="6">HARDWARE DESIGNS</text>
  <text x="72" y="600" fill="#ffd166" font-size="44" font-weight="700" letter-spacing="10">COMING SOON</text>
  <text x="72" y="648" fill="#cfe3ff" fill-opacity="0.75" font-size="18" letter-spacing="1">CAD files will live in hardware/cad/</text>

  <!-- title block -->
  <g stroke="#cfe3ff" stroke-width="2" fill="none">
    <rect x="968" y="468" width="400" height="180"/>
    <path d="M968 516H1368M968 564H1368M968 606H1368M1168 564V648"/>
  </g>
  <g fill="#cfe3ff" font-size="13" letter-spacing="1">
    <text x="984" y="486" fill-opacity="0.6">PROJECT</text>
    <text x="984" y="506" fill="#ffffff" font-size="18">AUTONOMOUS GOLF CART</text>
    <text x="984" y="534" fill-opacity="0.6">SHEET</text>
    <text x="984" y="554" fill="#ffffff" font-size="18">HARDWARE · MOCKUPS</text>
    <text x="984" y="582" fill-opacity="0.6">STATUS</text>
    <text x="984" y="598" fill="#ffd166" font-size="16">IN PROGRESS</text>
    <text x="1184" y="582" fill-opacity="0.6">REV</text>
    <text x="1184" y="598" fill="#ffffff" font-size="16">0</text>
    <text x="984" y="626" fill-opacity="0.6">SCALE</text>
    <text x="984" y="642" fill="#ffffff" font-size="15">1:1</text>
    <text x="1184" y="626" fill-opacity="0.6">UNITS</text>
    <text x="1184" y="642" fill="#ffffff" font-size="15">mm</text>
  </g>
</svg>
